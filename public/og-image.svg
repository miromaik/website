<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <!-- Solid Background -->
  <rect x="0" y="0" width="1200" height="630" fill="#141218" />
  
  <!-- Subtle Gradient/Glow Effect -->
  <defs>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%" fx="50%" fy="50%">
      <stop offset="0%" stop-color="#405F90" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#141218" stop-opacity="0" />
    </radialGradient>
  </defs>
  <rect x="0" y="0" width="1200" height="630" fill="url(#glow)" />

  <!-- Texts -->
  <!-- Main Title -->
  <text x="600" y="300" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="84" font-weight="700" fill="#E6E0E9" text-anchor="middle" letter-spacing="-1">Miroslaw Maik</text>
  
  <!-- Role -->
  <text x="600" y="380" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="40" font-weight="500" fill="#A8C8FF" text-anchor="middle" letter-spacing="1">Full Stack Developer</text>
</svg>
